name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"
  QT_QPA_PLATFORM: offscreen
  PDFSTUDIO_NO_RECOVERY_PROMPT: "1"
  PDFSTUDIO_DISCARD_ON_CLOSE: "1"
  PDFSTUDIO_NO_DIALOGS: "1"

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff mypy
      - name: Ruff
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: mypy
        run: mypy src || true   # advisory until the strict-typing milestone

  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon0 libegl1 libgl1 libdbus-1-3 libfontconfig1 \
            tesseract-ocr tesseract-ocr-eng ghostscript

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install tesseract ghostscript || true

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: choco install --no-progress tesseract ghostscript || exit 0

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[office,forms,dev]"

      - name: Run the test suite
        run: pytest -m "not slow" --cov=src/pdfstudio --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Archive logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: |
            ~/.cache/pdfstudio/logs/
            ~/Library/Caches/pdfstudio/logs/
          if-no-files-found: ignore

  slow:
    name: Stress and benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon0 libegl1 libgl1 libdbus-1-3 libfontconfig1
      - run: pip install -e ".[dev]"
      - name: Benchmarks
        run: pytest -m benchmark -s --no-header
      - name: Stress tests
        run: pytest -m slow -s --no-header

  package:
    name: Package ${{ matrix.os }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: appimage
            artefact: "dist/*.AppImage"
          - os: windows-latest
            target: msi
            artefact: "dist/*.exe"
          - os: macos-latest
            target: dmg
            artefact: "dist/*.dmg"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon0 libegl1 libgl1 libfontconfig1 fuse
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install --no-progress innosetup

      - run: pip install -e ".[office,forms]" pyinstaller

      - name: Build
        run: python packaging/build.py --target ${{ matrix.target }} --clean

      - name: Smoke-test the CLI
        run: python -m pdfstudio info --help

      - uses: actions/upload-artifact@v4
        with:
          name: pdfstudio-${{ matrix.os }}
          path: ${{ matrix.artefact }}
          if-no-files-found: warn

  release:
    name: Publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artefacts/**/*
          generate_release_notes: true
          draft: true

  publish-pypi:
    name: Publish to PyPI
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
